<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f6">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/hub.css' | relative_url }}">
    <script src="{{ '/assets/js/tag-filters.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      {% include sidebar.html %}
      <main class="main-content" id="main-content" tabindex="-1">
        <div class="content-wrap">
          {{ content }}
          <footer class="site-footer">
            <span>ThinkInfoSec Hub © 2021–{{ 'now' | date: '%Y' }}</span>
            <span aria-hidden="true">·</span>
            <a href="https://thinkinfosec.org">Visit ThinkInfoSec Hub</a>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
